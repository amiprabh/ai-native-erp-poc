spring.application.name=ai-native-erp-poc

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aierp_db
spring.datasource.username=erp_user
spring.datasource.password=erp_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=erp-group