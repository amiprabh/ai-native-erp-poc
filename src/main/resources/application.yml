spring:
  application:
    name: ai-native-erp-poc

  datasource:
    url: jdbc:postgresql://localhost:5432/aierp_db
    username: erp_user
    password: erp_password
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        hbm2ddl.create_namespaces: true    

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: meta-llama/llama-3.3-70b-instruct
      embedding:
        base-url: https://openrouter.ai/api
        api-key: ${OPENROUTER_API_KEY}
        options:
          model: openai/text-embedding-3-small
          dimensions: 1536

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: true

erp:
  routing:
    # LLM proposals below this confidence require human approval. Tune only after reviewing eval reports.
    llm-review-threshold: 0.93

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: erp-group
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.aierp.dto
        spring.json.value.default.type: com.aierp.dto.WebhookEnvelope

    listener:
      ack-mode: record
      missing-topics-fatal: false

    template:
      observation-enabled: true