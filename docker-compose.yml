services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aierp_db
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
    ports:
      - "5432:5432"

  kafka:
    image: apache/kafka:3.7.1
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        PLAINTEXT://0.0.0.0:29092,
        CONTROLLER://0.0.0.0:29093,
        PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-storage.sh format \
          --ignore-formatted \
          --cluster-id "$$(/opt/kafka/bin/kafka-storage.sh random-uuid)" \
          --config /opt/kafka/config/kraft/server.properties || true

        /opt/kafka/bin/kafka-server-start.sh \
          /opt/kafka/config/kraft/server.properties &

        echo "Waiting for Kafka..."
        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server localhost:9092 \
          --list > /dev/null 2>&1
        do
          sleep 2
        done

        echo "Creating application topics..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server localhost:9092 \
          --create \
          --if-not-exists \
          --topic invoice-ingestion-topic \
          --partitions 3 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server localhost:9092 \
          --create \
          --if-not-exists \
          --topic invoice-ingestion-topic.DLT \
          --partitions 3 \
          --replication-factor 1

        echo "Kafka ready."

        wait